# Swarmpit: Stacks → Add stack
# Образ app: weqil/hrono-app:1.0.4 — после push на сервере: docker pull + redeploy stack
#
# Перед DEPLOY — создать Docker Config:
#   docker config create hrono_nginx docker/nginx/swarm.conf

version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrono
      POSTGRES_USER: hrono
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  app:
    image: weqil/hrono-app:1.0.4
    environment:
      APP_NAME: Hrono
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://94.230.132.168:8081}"
      APP_KEY: "base64:ЗАМЕНИТЕ_ВАШ_КЛЮЧ"
      APP_LOCALE: "ru"
      APP_FALLBACK_LOCALE: "ru"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: hrono
      DB_USERNAME: hrono
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      API_SECRET: "${API_SECRET:-}"
      WS_SECRET_KEY: "${WS_SECRET_KEY:-}"
    networks:
      - db_net
      - nginx_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8081}:80"
    configs:
      - source: hrono_nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      - nginx_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  db_net:
  nginx_net:

volumes:
  postgres_data:

configs:
  hrono_nginx:
    external: true
