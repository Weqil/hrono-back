# Образы:
#   app:   weqil/hrono-app:1.0.28
#   nginx: weqil/hrono-nginx:1.0.28
# Сборка с Mac: только --platform linux/amd64 (иначе unsupported platform в Swarm).
#   docker build --platform linux/amd64 -t weqil/hrono-app:TAG -f Dockerfile .
#   docker build --platform linux/amd64 -t weqil/hrono-nginx:TAG -f docker/nginx/Dockerfile .
# После push: на сервере обновить stack в Swarmpit и Redeploy (pull сам не обновляет сервисы).
#
# Автозакрытие стримов: worker + scheduler обязательны и с теми же MOTO_API_URL / MOTO_SERVICE_BEARER что у app.

version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrono
      POSTGRES_USER: hrono
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  app:
    image: weqil/hrono-app:1.0.28
    environment:
      APP_NAME: Hrono
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://94.230.132.168:8081}"
      APP_KEY: "base64:ЗАМЕНИТЕ_ВАШ_КЛЮЧ"
      APP_LOCALE: "ru"
      APP_FALLBACK_LOCALE: "ru"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: hrono
      DB_USERNAME: hrono
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      API_SECRET: "${API_SECRET:-}"
      WS_SECRET_KEY: "${WS_SECRET_KEY:-}"
      MOTO_API_URL: "${MOTO_API_URL:-}"
      MOTO_SERVICE_BEARER: "${MOTO_SERVICE_BEARER:-}"
      STREAM_AUTO_CLOSE_GRACE_MINUTES: "${STREAM_AUTO_CLOSE_GRACE_MINUTES:-10}"
      RUN_MIGRATIONS: "true"
    volumes:
      - hrono_public:/shared-public
    networks:
      - db_net
      - nginx_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  # Delayed AutoCloseArrivalStreamJob — нужны те же MOTO_* что у app
  worker:
    image: weqil/hrono-app:1.0.28
    environment:
      APP_NAME: Hrono
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://94.230.132.168:8081}"
      APP_KEY: "base64:ЗАМЕНИТЕ_ВАШ_КЛЮЧ"
      APP_LOCALE: "ru"
      APP_FALLBACK_LOCALE: "ru"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: hrono
      DB_USERNAME: hrono
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      API_SECRET: "${API_SECRET:-}"
      WS_SECRET_KEY: "${WS_SECRET_KEY:-}"
      MOTO_API_URL: "${MOTO_API_URL:-}"
      MOTO_SERVICE_BEARER: "${MOTO_SERVICE_BEARER:-}"
      STREAM_AUTO_CLOSE_GRACE_MINUTES: "${STREAM_AUTO_CLOSE_GRACE_MINUTES:-10}"
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=3", "--max-time=3600"]
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  # arrivals:auto-close-expired каждую минуту — нужны те же MOTO_* что у app
  scheduler:
    image: weqil/hrono-app:1.0.28
    environment:
      APP_NAME: Hrono
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://94.230.132.168:8081}"
      APP_KEY: "base64:ЗАМЕНИТЕ_ВАШ_КЛЮЧ"
      APP_LOCALE: "ru"
      APP_FALLBACK_LOCALE: "ru"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: hrono
      DB_USERNAME: hrono
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      API_SECRET: "${API_SECRET:-}"
      WS_SECRET_KEY: "${WS_SECRET_KEY:-}"
      MOTO_API_URL: "${MOTO_API_URL:-}"
      MOTO_SERVICE_BEARER: "${MOTO_SERVICE_BEARER:-}"
      STREAM_AUTO_CLOSE_GRACE_MINUTES: "${STREAM_AUTO_CLOSE_GRACE_MINUTES:-10}"
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  nginx:
    image: weqil/hrono-nginx:1.0.28
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - hrono_public:/var/www/html/public:ro
    networks:
      - nginx_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  db_net:
  nginx_net:

volumes:
  postgres_data:
  hrono_public:
