# Образы:
#   app:   weqil/hrono-app:1.0.13
#   nginx: weqil/hrono-nginx:1.0.13
# После push: на сервере обновить stack в Swarmpit и Redeploy (pull сам не обновляет сервисы).

version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hrono
      POSTGRES_USER: hrono
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  app:
    image: weqil/hrono-app:1.0.13
    environment:
      APP_NAME: Hrono
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://94.230.132.168:8081}"
      APP_KEY: "base64:ЗАМЕНИТЕ_ВАШ_КЛЮЧ"
      APP_LOCALE: "ru"
      APP_FALLBACK_LOCALE: "ru"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: hrono
      DB_USERNAME: hrono
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      API_SECRET: "${API_SECRET:-}"
      WS_SECRET_KEY: "${WS_SECRET_KEY:-}"
    volumes:
      - hrono_public:/shared-public
    networks:
      - db_net
      - nginx_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  nginx:
    image: weqil/hrono-nginx:1.0.13
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - hrono_public:/var/www/html/public:ro
    networks:
      - nginx_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  db_net:
  nginx_net:

volumes:
  postgres_data:
  hrono_public:
